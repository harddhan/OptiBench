[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optibench"
version = "0.1.0"
description = "A benchmark suite for optimization algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
